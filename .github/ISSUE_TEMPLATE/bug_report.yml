name: Bug Report
description: Report a bug in opencode-loaded
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.

  - type: input
    id: opencode-version
    attributes:
      label: OpenCode Version
      description: Run `opencode --version` or check in OpenCode TUI
      placeholder: "e.g. 2.3.2"
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Plugin Version / Commit
      description: If installed from git, provide the commit hash. If from npm, the version.
      placeholder: "e.g. 0.1.0 or abc1234"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: Run `node --version`
      placeholder: "e.g. 22.14.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Start OpenCode with agent X
        2. Run command Y
        3. Observe Z
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: The badge should show...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
      placeholder: The badge shows...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Paste relevant logs (from `~/.local/share/opencode/log/opencode.log`) or screenshots
      render: text
      placeholder: |
        [ERROR] ...

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: I have tested with a fresh OpenCode session
          required: false
        - label: The issue occurs with default plugin configuration
          required: false